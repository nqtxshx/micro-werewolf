<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro-Werewolf Role Revealer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121214;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1f22;
      border: 1px solid #2b2d31;
      padding: 2rem;
      border-radius: 12px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h2 { margin-top: 0; }
    .role-box {
      font-size: 1.5rem;
      font-weight: bold;
      padding: 1.5rem;
      border-radius: 8px;
      margin: 1.5rem 0;
      background: #2b2d31;
    }
    .hint { color: #949ba4; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Secret Identity</h2>
    <div id="role-display" class="role-box">Decrypting...</div>
    <div id="role-hint" class="hint"></div>
  </div>

  <script>
    // PRNG matching the bot
    function prng(seed) {
      return function () {
        let t = (seed += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function decryptToken(tokenHex) {
      if (!tokenHex || tokenHex.length < 8) return null;
      
      const seed = parseInt(tokenHex.substr(0, 8), 16);
      const cipherHex = tokenHex.substr(8);
      const rand = prng(seed);
      
      let plain = "";
      for (let i = 0; i < cipherHex.length; i += 2) {
        const byte = parseInt(cipherHex.substr(i, 2), 16);
        const mask = Math.floor(rand() * 256);
        plain += String.fromCharCode(byte ^ mask);
      }
      return plain;
    }

    const hash = window.location.hash.substring(1);
    const result = decryptToken(hash);

    const display = document.getElementById("role-display");
    const hint = document.getElementById("role-hint");

    if (!result) {
      display.textContent = "❌ Invalid Token";
      hint.textContent = "Please use the official link provided by the bot.";
    } else {
      const parts = result.split("|"); // [Role, ExtraHint]
      const role = parts[0];
      const detail = parts[1] || "";

      if (role === "Werewolf") {
        display.textContent = "🐺 Werewolf";
        display.style.color = "#ed4245";
        hint.textContent = "Blend in with the village, deflect accusations, and survive the vote.";
      } else if (role === "Seer") {
        display.textContent = "🔮 Seer";
        display.style.color = "#5865f2";
        hint.textContent = detail ? `Vision: ${detail}` : "You see the truth.";
      } else {
        display.textContent = "🌾 Villager";
        display.style.color = "#57f287";
        hint.textContent = "Deduce who the Werewolf is through open thread debate and vote them out.";
      }
    }
  </script>
</body>
</html>
